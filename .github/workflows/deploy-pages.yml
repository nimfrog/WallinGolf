name: Deploy till GitHub Pages

on:
  push:
    branches:
      - main
      - claude/github-connection-537lm2
  workflow_dispatch:

# Rättigheter som krävs för att publicera till GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Tillåt endast en pågående deploy åt gången.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checka ut koden
        uses: actions/checkout@v4

      - name: Sätt upp Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installera beroenden
        run: npm ci

      - name: Kör tester
        run: npm test

      - name: Bygg
        run: npm run build

      - name: Konfigurera Pages
        uses: actions/configure-pages@v5

      - name: Ladda upp artefakt
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicera till GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
